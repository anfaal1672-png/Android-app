plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aipaste.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aipaste.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // 誰でもインストールできるよう debug 署名で配布
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
